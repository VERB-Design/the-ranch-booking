<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/brand/favicon-r.svg" type="image/svg+xml" />
    <!-- Inter is the only webfont this build loads; Times New Roman (headings)
         is a system stack, so there is nothing to fetch for it. Preconnect
         shaves the DNS + TLS handshake off the first paint's font request. -->
    <!-- Times New Roman (headings) — client's Adobe Fonts kit -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/sva0dtq.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>The Ranch — Reserve Your Stay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
